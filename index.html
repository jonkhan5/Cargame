<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Dodge Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    touch-action: manipulation;
}

h1 {
    margin: 12px 0 5px;
    font-size: 28px;
}

#score {
    font-size: 22px;
    margin-bottom: 10px;
}

#game {
    position: relative;
    width: 360px;
    height: 600px;
    max-width: 94vw;
    margin: auto;
    overflow: hidden;
    background: #444;
    border-left: 6px solid white;
    border-right: 6px solid white;
}

/* Road lines */
.line {
    position: absolute;
    width: 8px;
    height: 80px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
}

/* Player car */
.car {
    position: absolute;
    width: 55px;
    height: 90px;
    border-radius: 12px;
}

#player {
    background: red;
    bottom: 20px;
    left: 152px;
    z-index: 5;
}

#player::before,
.enemy::before {
    content: "";
    position: absolute;
    width: 35px;
    height: 28px;
    background: #222;
    left: 10px;
    top: 12px;
    border-radius: 5px;
}

#player::after,
.enemy::after {
    content: "";
    position: absolute;
    width: 35px;
    height: 18px;
    background: #222;
    left: 10px;
    bottom: 10px;
    border-radius: 5px;
}

/* Enemy */
.enemy {
    position: absolute;
    width: 55px;
    height: 90px;
    background: yellow;
    border-radius: 12px;
}

/* Buttons */
.controls {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 25px;
}

.controlBtn {
    width: 110px;
    height: 60px;
    font-size: 28px;
    border: 0;
    border-radius: 12px;
    background: white;
    color: black;
}

#startBtn,
#restartBtn {
    margin-top: 15px;
    width: 230px;
    height: 55px;
    font-size: 20px;
    border: 0;
    border-radius: 12px;
}

#gameOver {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 20;
}

#gameOver h2 {
    font-size: 40px;
    margin: 0 0 10px;
}

#finalScore {
    font-size: 22px;
}
</style>
</head>

<body>

<h1>🚗 Car Dodge</h1>

<div id="score">Score: 0</div>

<div id="game">

    <div class="line" style="top:0"></div>
    <div class="line" style="top:150px"></div>
    <div class="line" style="top:300px"></div>
    <div class="line" style="top:450px"></div>

    <div id="player" class="car"></div>

    <div id="gameOver">
        <h2>GAME OVER</h2>
        <div id="finalScore">Score: 0</div>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>

</div>

<div class="controls">
    <button class="controlBtn" id="leftBtn">⬅️</button>
    <button class="controlBtn" id="rightBtn">➡️</button>
</div>

<button id="startBtn">START GAME</button>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let playerX = 152;
let score = 0;
let speed = 5;
let running = false;
let animationFrame;
let enemyTimer = null;
let enemies = [];

/* START */
startBtn.addEventListener("click", startGame);

function startGame() {

    if (running) return;

    clearGame();

    running = true;
    score = 0;
    speed = 5;
    playerX = 152;

    player.style.left = playerX + "px";
    scoreText.textContent = "Score: 0";
    gameOver.style.display = "none";

    createEnemy();

    gameLoop();
}

/* CREATE ENEMY */
function createEnemy() {

    if (!running) return;

    const enemy = document.createElement("div");

    enemy.className = "enemy";
    enemy.style.top = "-100px";

    const lanes = [35, 152, 269];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];

    enemy.style.left = lane + "px";

    game.appendChild(enemy);
    enemies.push(enemy);

    enemyTimer = setTimeout(createEnemy, Math.max(450, 1000 - score * 8));
}

/* GAME LOOP */
function gameLoop() {

    if (!running) return;

    moveRoad();
    moveEnemies();

    animationFrame = requestAnimationFrame(gameLoop);
}

/* ROAD */
function moveRoad() {

    const lines = document.querySelectorAll(".line");

    lines.forEach(line => {

        let top = parseInt(line.style.top);

        top += speed;

        if (top > 600) {
            top = -80;
        }

        line.style.top = top + "px";
    });
}

/* ENEMIES */
function moveEnemies() {

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        let top = parseInt(enemy.style.top);

        top += speed;

        enemy.style.top = top + "px";

        if (collision(player, enemy)) {
            endGame();
            return;
        }

        if (top > 620) {

            enemy.remove();
            enemies.splice(i, 1);

            score++;

            scoreText.textContent = "Score: " + score;

            if (score % 5 === 0) {
                speed += 0.5;
            }
        }
    }
}

/* COLLISION */
function collision(a, b) {

    const A = a.getBoundingClientRect();
    const B = b.getBoundingClientRect();

    return !(
        A.bottom < B.top ||
        A.top > B.bottom ||
        A.right < B.left ||
        A.left > B.right
    );
}

/* MOVE LEFT */
function moveLeft() {

    if (!running) return;

    playerX -= 30;

    if (playerX < 5) {
        playerX = 5;
    }

    player.style.left = playerX + "px";
}

/* MOVE RIGHT */
function moveRight() {

    if (!running) return;

    playerX += 30;

    if (playerX > 300) {
        playerX = 300;
    }

    player.style.left = playerX + "px";
}

/* BUTTONS */
leftBtn.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    moveLeft();
});

rightBtn.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    moveRight();
});

/* KEYBOARD */
document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft") {
        moveLeft();
    }

    if (e.key === "ArrowRight") {
        moveRight();
    }
});

/* GAME OVER */
function endGame() {

    running = false;

    cancelAnimationFrame(animationFrame);
    clearTimeout(enemyTimer);

    finalScore.textContent = "Your Score: " + score;

    gameOver.style.display = "flex";
}

/* RESTART */
restartBtn.addEventListener("click", function() {

    startGame();

});

/* CLEAR */
function clearGame() {

    cancelAnimationFrame(animationFrame);
    clearTimeout(enemyTimer);

    enemies.forEach(enemy => enemy.remove());

    enemies = [];
}

</script>

</body>
</html>
